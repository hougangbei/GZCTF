name: gzctf

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gzctf
      POSTGRES_DB: gzctf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U gzctf -d gzctf']
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 10

  app:
    image: ${GZCTF_IMAGE:?set GZCTF_IMAGE in .env}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '${GZCTF_PORT:-8080}:8080'
    environment:
      GZCTF_ConnectionStrings__Database: Host=db;Port=5432;Database=gzctf;Username=gzctf;Password=${POSTGRES_PASSWORD}
      GZCTF_ConnectionStrings__RedisCache: redis:6379
      GZCTF_xorKey: ${GZCTF_XOR_KEY:?set GZCTF_XOR_KEY in .env}
      GZCTF_ADMIN_PASSWORD: ${GZCTF_ADMIN_PASSWORD:?set GZCTF_ADMIN_PASSWORD in .env}
      GZCTF_EmailConfig__SenderAddress: ${SMTP_SENDER_ADDRESS:-}
      GZCTF_EmailConfig__SenderName: ${SMTP_SENDER_NAME:-GZCTF}
      GZCTF_EmailConfig__UserName: ${SMTP_USERNAME:-}
      GZCTF_EmailConfig__Password: ${SMTP_PASSWORD:-}
      GZCTF_EmailConfig__Smtp__Host: ${SMTP_HOST:-127.0.0.1}
      GZCTF_EmailConfig__Smtp__Port: ${SMTP_PORT:-587}
      GZCTF_Updater__SocketPath: /run/gzctf-updater/updater.sock
      GZCTF_Updater__TokenFile: /run/secrets/gzctf-updater-token
    volumes:
      - ./files:/app/files
      - ./run:/run/gzctf-updater:ro
      - ./updater.token:/run/secrets/gzctf-updater-token:ro
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  db_data:
  redis_data:
