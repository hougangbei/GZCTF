# GZCTF uses PUT for updates and DELETE for removals. Keep the other CRS rules enabled.
SecAction "id:900200,phase:1,pass,t:none,nolog,setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT DELETE'"

# The flag template in a challenge runtime configuration can contain {userId}.
# CRS 942550 treats it as SQLi; exclude only this field on challenge updates.
SecRule REQUEST_FILENAME "@rx ^/api/admin/challenges/[0-9a-fA-F-]{36}$" "id:100200,phase:1,pass,nolog,t:none,ctl:ruleRemoveTargetById=942550;ARGS:json.runtimeConfigurationJson"
