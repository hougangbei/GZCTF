name: Publish self-update image

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/self-update-image.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: src/global.json
      - uses: actions/setup-node@v6
        with:
          node-version: latest
      - uses: pnpm/action-setup@v6
        with:
          version: latest
      - name: Set image repository
        shell: bash
        run: echo "IMAGE_REPOSITORY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gzctf" >> "$GITHUB_ENV"
      - name: Set build timestamp
        id: timestamp
        shell: bash
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Publish application
        working-directory: src/GZCTF
        run: dotnet publish GZCTF.csproj -c Release -o publish/linux/amd64 -r linux-x64 --no-self-contained /p:PublishReadyToRun=true
        env:
          VITE_APP_GIT_SHA: ${{ github.sha }}
          VITE_APP_GIT_NAME: main
          VITE_APP_BUILD_TIMESTAMP: ${{ steps.timestamp.outputs.value }}
          SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./src/GZCTF
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:sha-${{ github.sha }}
            ${{ env.IMAGE_REPOSITORY }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
